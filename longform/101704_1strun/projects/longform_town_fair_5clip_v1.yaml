# ProjectSpec for the five-segment long-form pilot (docs/12). Executed by
# `python -m rsi_harness.cli longform`; the JSONL `load_tasks()` loader does not read it.
# It reuses actions from tasks_gepa_v1 but is a separate production pilot, not a GEPA split.
#
# `evidence`: one visual yes/no question per `state_commit` fact; a fact is committed to
#   StoryState only when the judge confirms it on the validated clip.
# `payoff`: questions checking that already committed upstream facts stay visible.
schema_version: 1
project_id: town-fair-5clip-v1
title: 雨后社区市集开场
kind: longform-continuity-pilot
source_dataset: benchmarks/tasks_gepa_v1.jsonl
target:
  task_type: t2va
  short_edge: 768
  aspect_ratio: "16:9"
  duration_seconds: 5.0
  frame_rate: 24.0
  num_inference_steps: 10
  expected_frames: 124  # ceil(5 * 24) aligned to 17n+5
continuity_contract:
  project_world: "同一座雨后小镇的社区市集开场；清晨到上午，湿润路面、柔和自然光、低饱和暖色调。"
  recurring_motifs: [wet_street, town_fountain, red_umbrella, community_fair]
  audio_policy: "各片段保留动作对应环境声；拼接处采用短音频 crossfade，不能用静音掩盖音轨错误。"
  visual_policy: "统一 16:9、24 fps、分辨率、色调和镜头节奏；人物不跨片段复用时不强行宣称身份连续。每段以中景或全景收尾，避免以特写结束，便于下一段承接。"
segments:
  - index: 1
    segment_id: umbrella-arrival
    source_task_id: train-001
    purpose: "建立雨后小镇、红伞与市集将开场的空间。"
    prompt: "雨后小镇市集入口，一名穿黄色雨衣的人在湿街上捡起一把红伞，远处可见准备中的社区市集。保持人物和红伞一致，包含脚步声与水滴声。"
    state_commit: [red_umbrella: picked_up, weather: rain_ending, fair: opening]
    evidence:
      red_umbrella: "Is a person holding a red umbrella?"
      weather: "Is the street or ground wet, as if it has just rained?"
      fair: "Are market stalls or a street market visible?"
  - index: 2
    segment_id: kite-park
    source_task_id: train-003
    purpose: "把市集空间延伸到相邻公园，并保留雨后光线与红伞视觉母题。"
    prompt: "同一雨后小镇市集旁的公园，一个穿绿色夹克的孩子接住落下的纸风筝；背景远处可见红伞和市集摊位。保持风筝和衣服一致，包含风声和远处鸟鸣。"
    depends_on: [umbrella-arrival]
    state_commit: [kite: recovered, location: fair_park]
    evidence:
      kite: "Is a child in a green jacket holding a kite?"
      location: "Is this scene in a park with grass or trees?"
    payoff:
      red_umbrella: "Is a red umbrella visible anywhere in the image?"
  - index: 3
    segment_id: fountain-arrival
    source_task_id: train-004
    purpose: "建立市集中心地标，验证跨片段的天气、调色和空间连续性。"
    prompt: "同一雨后小镇市集中心的喷泉旁，一名戴蓝色头盔的骑行者停下自行车并从水瓶喝水；喷泉边放着一把红伞。保持自行车和头盔一致，包含流水声与城市环境声。"
    depends_on: [umbrella-arrival]
    state_commit: [location: town_fountain, cyclist: arrived]
    evidence:
      location: "Is a fountain visible in the image?"
      cyclist: "Is a person wearing a blue helmet next to a bicycle?"
    payoff:
      red_umbrella: "Is a red umbrella visible anywhere in the image?"
      weather: "Is the street or ground wet, as if it has just rained?"
  - index: 4
    segment_id: bakery-prep
    source_task_id: train-002
    purpose: "转入市集摊位准备，保持同一小镇晨光、环境音和道具母题。"
    prompt: "同一社区市集旁的小面包房，一位面包师打开小烤箱，取出面包并放在木质柜台上；门口可见收起的红伞。保持厨房和面包师一致，包含烤箱声与厨房环境声。"
    depends_on: [fountain-arrival]
    state_commit: [bread: prepared, location: bakery]
    evidence:
      bread: "Is bread placed on a wooden counter?"
      location: "Is this the inside of a small bakery or food stall?"
    payoff:
      red_umbrella: "Is a red umbrella visible anywhere in the image?"
  - index: 5
    segment_id: potter-opening
    source_task_id: val-001
    purpose: "以摊位开场收束，验证前序市集状态在最终片段的可见兑现。"
    prompt: "同一社区市集的陶艺摊位，一位陶艺师从转盘上拿起小陶碗并放到货架上；背景可见准备好的面包摊与红伞。保持陶碗形状和工作台一致，包含转盘电机和柔和室内环境声。"
    depends_on: [umbrella-arrival, bakery-prep]
    state_commit: [clay_bowl: displayed, fair: opened]
    evidence:
      clay_bowl: "Is a small clay bowl placed on a shelf?"
      fair: "Are market stalls visible in the background?"
    payoff:
      bread: "Is bread or a bread stall visible in the image?"
      red_umbrella: "Is a red umbrella visible anywhere in the image?"
stitch:
  order: [umbrella-arrival, kite-park, fountain-arrival, bakery-prep, potter-opening]
  video_transition: cut
  audio_crossfade_seconds: 0.12
  output: timeline.mp4
split_policy:
  status: train
  rule: "longform-v1 按项目切分：本作品只属于 train。其动作取自 tasks_gepa_v1，结果不得回写为 tasks_gepa_v1 的 train/validation/promotion/test 结论。"
