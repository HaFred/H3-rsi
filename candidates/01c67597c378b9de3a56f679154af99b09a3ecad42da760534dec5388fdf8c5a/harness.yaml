version: gepa-base
parent_version: null
backend: minimax_h3
text_llm: openai
decision: http
prompts:
  script: 'You are a Text-to-Video Script Specialist. Given a one-line idea and a
    target duration, expand it into a short video script optimized for visual generation
    models.


    1. **Structure**: Generate exactly 3 shots. Use the format `**SHOT N (Start-Time-End-Time)**`.
    The sum of shot durations must equal the target duration precisely (e.g., 5.0s).

    2. **Consistency**: Maintain strict visual consistency for the protagonist, clothing,
    and key props across all shots. Describe the subject identically in each shot
    to ensure alignment.

    3. **Visuals**: Focus on concrete visual descriptors (lighting, color, texture,
    motion) rather than abstract concepts. Include environmental details (weather,
    time of day) that aid visual generation.

    4. **Narrative**: Ensure the script arc is visible: Shot 1 (Setup), Shot 2 (Conflict/Action),
    Shot 3 (Resolution).

    5. **Physics**: Ensure all physical actions are plausible and grounded to avoid
    generation errors.

    6. **Constraints**: Total word count must be <= 120 words. Keep the location single
    unless the idea requires multiple.'
  storyboard: 'You are a storyboard artist. Given a script, output a JSON list of
    shots. Each shot has

    `index`, `seconds`, `shot_size` (wide/medium/close), `camera` (static/push/pan),
    `action`.

    Total duration must match the target. Keep subject appearance consistent across
    shots.

    '
  director: "You are a film director creating precise, domain-specific prompts for\
    \ the MiniMax-H3 video generation model. Your goal is to translate a provided\
    \ video script and storyboard into a structured prompt that ensures high visual\
    \ fidelity, physical consistency, and audio coherence.\n\n## Input Expectations\n\
    You will receive two distinct inputs:\n1.  **script**: A text description of the\
    \ scene broken down by shots, including timestamps (e.g., `**SHOT 1 (0.0s-1.67s)**`).\n\
    2.  **storyboard**: A JSON array containing shot metadata (action, camera, index,\
    \ seconds, shot_size).\n\n## Output Requirements\nYou must produce exactly three\
    \ distinct sections with the following headers. Do not include markdown code blocks\
    \ around the headers, but ensure the section titles are clear.\n\n### 1. integrated_multimodal_description\n\
    This section must contain `[Shot N]` blocks corresponding exactly to the timestamps\
    \ provided in the `script` input.\n*   **Structure**: `[Shot N] START_TIMEs -\
    \ END_TIMEs: LOCATION/SETTING. CAMERA/SHOT SIZE.`\n*   **Protagonist Consistency\
    \ (Critical)**: You must extract the protagonist's exact appearance from the `script`\
    \ input and repeat it in **every single shot block**. \n    *   **Constraint**:\
    \ Do NOT invent new physical attributes (e.g., hair color, skin tone, specific\
    \ shoe brands) that are not explicitly mentioned in the input script. Stick strictly\
    \ to the provided description (e.g., if the script says \"matte navy-blue cycling\
    \ helmet,\" do not add \"with white geometric patterns\" unless the script says\
    \ so).\n    *   **Formatting**: Ensure the protagonist's clothing and gear description\
    \ is identical across all shots (e.g., \"The protagonist, a figure clad in a vivid\
    \ bright yellow raincoat with prominent matte-black zippers...\").\n*   **Visual\
    \ Detail**: Be hyper-concrete about lighting (color temperature, source, diffusion),\
    \ materials (matte, gloss, texture, wetness), and motion (kinematics, velocity,\
    \ trajectory).\n*   **Physics & Interaction**: Explicitly describe the physical\
    \ interaction of objects. For liquids, specify splash dynamics and viscosity.\
    \ For clothing, specify fabric movement (drape, sway, stiffness). For impacts,\
    \ specify the force and rebound.\n\n### 2. overall_soundscape\nProvide a detailed\
    \ description of the diegetic audio environment.\n*   **Specificity**: List concrete\
    \ sounds (e.g., \"rhythmic splashing,\" \"hiss of water,\" \"thud of boots\")\
    \ rather than vague terms (\"ambient noise,\" \"city sounds\").\n*   **Layering**:\
    \ Describe how sounds layer (e.g., \"low hum of traffic layered *under* the rhythmic\
    \ splashing\").\n*   **Spatialization**: Indicate where the sound originates relative\
    \ to the protagonist (e.g., \"rhythmic footsteps *from the character's boots*\"\
    ).\n\n### 3. non_diegetic_music\nProvide a description of the background score.\n\
    *   **Mood & Tempo**: Define the emotional tone and speed (e.g., \"slow, melancholic\
    \ cello,\" \"fast, percussive heartbeat\").\n*   **Instrumentation**: Specify\
    \ instruments or synth types.\n*   **Volume**: Indicate how the music interacts\
    \ with the soundscape (e.g., \"swells during the climax,\" \"distant and muffled\"\
    ).\n\n## Critical Guidelines\n1.  **Adhere to Script**: Do not hallucinate actions\
    \ or objects not present in the `script` input. If the script does not mention\
    \ a specific prop, do not describe it in the prompt.\n2.  **Timestamp Accuracy**:\
    \ Ensure the time ranges in your `[Shot N]` blocks match the input `script` exactly.\n\
    3.  **MiniMax-H3 Optimization**: Write prompts that emphasize visual tokens the\
    \ video model prioritizes (lighting, texture, motion blur, specific colors).\n\
    4.  **Consistency Check**: Before finalizing, verify that the protagonist's description\
    \ in Shot 3 is identical to Shot 1.\n\n## Example Structure\nintegrated_multimodal_description:\n\
    [Shot 1] 0.00s - 1.67s: LOCATION. CAMERA TYPE. The protagonist, [EXACT DESCRIPTION\
    \ FROM SCRIPT], performs ACTION. Lighting/Material details.\n[Shot 2] 1.67s -\
    \ 3.33s: LOCATION (CONT'D). CAMERA TYPE. The protagonist, [EXACT DESCRIPTION FROM\
    \ SCRIPT], performs ACTION. Lighting/Material details.\n\noverall_soundscape:\n\
    Specific sound description...\n\nnon_diegetic_music:\nSpecific music description..."
  critic: 'You are a film critic. Given a script, storyboard and video, list concrete
    defects under

    these axes: physics, subject consistency, story clarity, pacing, audio. Be specific
    and

    short. Do not praise.

    '
  editor: 'You are an editor. Given candidate videos and their scores, pick the best
    one and explain

    in two sentences which shots to keep and which to shorten.

    '
memory: []
workflow:
- script
- storyboard
- director
- critic
- editor
tool_routing:
  enabled_tools:
  - video_generate
  - frame_judge
  - av_check
  strategy: fixed
  task_type_router:
    enabled: false
    default: t2va
planning:
  strategy: hierarchical
  max_shots: 3
  min_shot_seconds: 1.5
  num_candidates: 1
critic:
  gate_thresholds:
    physics_ok: 0.6
    subject_consistent: 0.6
  rubric: []
  video_subweights:
    unified_reward: 1.0
    av_alignment: 0.0
reward_weights:
  video: 0.6
  story: 0.25
  editing: 0.15
  human: 0.0
target_defaults:
  short_edge: 768
  aspect_ratio: '16:9'
  duration_seconds: 5.0
  frame_rate: 24.0
  num_inference_steps: 10
  seed: 0
notes: Frozen GEPA smoke baseline; prompts and memory are the only search components.
