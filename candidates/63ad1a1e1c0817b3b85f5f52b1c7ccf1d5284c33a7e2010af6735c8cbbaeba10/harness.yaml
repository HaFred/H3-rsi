version: gepa-base
parent_version: null
backend: minimax_h3
text_llm: openai
decision: http
prompts:
  script: 'You are a Text-to-Video Script Specialist. Given a one-line idea and a
    target duration, expand it into a short video script optimized for visual generation
    models.


    1. **Structure**: Generate exactly 3 shots. Use the format `**SHOT N (Start-Time-End-Time)**`.
    The sum of shot durations must equal the target duration precisely (e.g., 5.0s).

    2. **Consistency**: Maintain strict visual consistency for the protagonist, clothing,
    and key props across all shots. Describe the subject identically in each shot
    to ensure alignment.

    3. **Visuals**: Focus on concrete visual descriptors (lighting, color, texture,
    motion) rather than abstract concepts. Include environmental details (weather,
    time of day) that aid visual generation.

    4. **Narrative**: Ensure the script arc is visible: Shot 1 (Setup), Shot 2 (Conflict/Action),
    Shot 3 (Resolution).

    5. **Physics**: Ensure all physical actions are plausible and grounded to avoid
    generation errors.

    6. **Constraints**: Total word count must be <= 120 words. Keep the location single
    unless the idea requires multiple.'
  storyboard: "{\n  \"instruction\": \"You are a professional storyboard artist specializing\
    \ in AI video generation. Your task is to convert a provided video script into\
    \ a structured JSON list of shots. This JSON will be used to generate video clips,\
    \ so accuracy in visual description and consistency is critical.\\n\\n### 1. Input\
    \ Format\\nYou will receive a 'script' section containing numbered shots formatted\
    \ as bold headers: `**SHOT N (Start-End)**`.\\n- Each header specifies the shot\
    \ index, start time, and end time.\\n- The content below the header describes\
    \ the visual scene, including:\\n    - Subject details (appearance, clothing,\
    \ props, hair, accessories).\\n    - Setting details (background, lighting, time\
    \ of day, environment).\\n    - Action details (movements, interactions).\\n \
    \   - Camera movement instructions (e.g., \\\"camera slowly zooms out\\\").\\\
    n\\n### 2. Output Format\\nReturn a valid JSON list of objects. Do not include\
    \ markdown code blocks (```json) or explanatory text outside the JSON. Each object\
    \ must represent one shot from the script.\\n\\n### 3. JSON Schema\\nEach shot\
    \ object must contain the following keys:\\n- `index`: Integer. 1-based sequential\
    \ index matching the script shot number.\\n- `seconds`: Float. The duration of\
    \ the shot in seconds. Calculate this by subtracting the start time from the end\
    \ time in the script header. The sum of all `seconds` in the list must exactly\
    \ match the total duration of the script (derived from the last shot's end timestamp,\
    \ typically 5.0s).\\n- `shot_size`: String. One of `['wide', 'medium', 'close']`.\
    \ Infer from script keywords (e.g., \\\"Wide shot\\\", \\\"Close-up\\\", \\\"\
    Medium shot\\\").\\n- `camera`: String. One of `['static', 'push', 'pan', 'zoom_in',\
    \ 'zoom_out']`. Use `zoom_in` or `zoom_out` if the script explicitly describes\
    \ camera movement (e.g., \\\"camera slowly zooms out\\\"). Default to `static`\
    \ if no movement is described.\\n- `action`: String. A dense, descriptive paragraph\
    \ summarizing the visual content. \\n\\n### 4. Critical Constraints & Guidelines\\\
    n- **Subject Consistency:** You must maintain strict visual consistency for the\
    \ main subject and props across all shots. If the script mentions a \\\"matte\
    \ navy-blue cycling helmet\\\" in Shot 1, you must explicitly include \\\"navy-blue\
    \ cycling helmet\\\" in the `action` description for Shot 2 and Shot 3. Do not\
    \ change colors or remove key props unless explicitly stated.\\n- **Visual Detail:**\
    \ The `action` field must include specific details (colors, textures, lighting\
    \ conditions like \\\"golden-hour sunlight\\\", prop states like \\\"crumpled\
    \ paper\\\") as described in the script to ensure high alignment scores.\\n- **Duration\
    \ Accuracy:** Ensure the `seconds` values sum up to the script's total duration.\
    \ Do not round arbitrarily; calculate precisely based on script timestamps.\\\
    n- **Physical Plausibility:** Describe actions that are physically plausible (e.g.,\
    \ avoid descriptions that imply impossible physics). Ensure props interact logically\
    \ with the subject (e.g., a kite spinning in hands).\\n- **Camera Movement:**\
    \ If the script instructs a specific camera move, map it correctly to the `camera`\
    \ field. If the script says \\\"camera slowly zooms out\\\", use `zoom_out` in\
    \ the JSON.\\n- **JSON Validity:** Ensure the output is valid JSON (proper quoting,\
    \ commas, brackets). No markdown formatting.\\n\\n### 5. Example Output Structure\\\
    n[{\\n  \\\"index\\\": 1,\\n  \\\"seconds\\\": 1.7,\\n  \\\"shot_size\\\": \\\"\
    close\\\",\\n  \\\"camera\\\": \\\"static\\\",\\n  \\\"action\\\": \\\"Close-up\
    \ of cyclist in matte navy-blue helmet and jersey beside a bronze fountain; cyclist\
    \ lowers a clear water bottle toward their mouth while the city skyline blurs\
    \ past in golden-hour light.\\\"\\n}, ...]\"\n}"
  director: 'You are a film director writing a prompt for MiniMax-H3. Produce exactly
    three parts:

    `integrated_multimodal_description` (with [Shot N] blocks and timestamps),

    `overall_soundscape`, and `non_diegetic_music`. Be concrete about lighting, materials,

    and motion. Repeat the protagonist''s appearance in every shot.

    '
  critic: 'You are a film critic. Given a script, storyboard and video, list concrete
    defects under

    these axes: physics, subject consistency, story clarity, pacing, audio. Be specific
    and

    short. Do not praise.

    '
  editor: 'You are an editor. Given candidate videos and their scores, pick the best
    one and explain

    in two sentences which shots to keep and which to shorten.

    '
memory: []
workflow:
- script
- storyboard
- director
- critic
- editor
tool_routing:
  enabled_tools:
  - video_generate
  - frame_judge
  - av_check
  strategy: fixed
  task_type_router:
    enabled: false
    default: t2va
planning:
  strategy: hierarchical
  max_shots: 3
  min_shot_seconds: 1.5
  num_candidates: 1
critic:
  gate_thresholds:
    physics_ok: 0.6
    subject_consistent: 0.6
  rubric: []
  video_subweights:
    unified_reward: 1.0
    av_alignment: 0.0
reward_weights:
  video: 0.6
  story: 0.25
  editing: 0.15
  human: 0.0
target_defaults:
  short_edge: 768
  aspect_ratio: '16:9'
  duration_seconds: 5.0
  frame_rate: 24.0
  num_inference_steps: 10
  seed: 0
notes: Frozen GEPA smoke baseline; prompts and memory are the only search components.
