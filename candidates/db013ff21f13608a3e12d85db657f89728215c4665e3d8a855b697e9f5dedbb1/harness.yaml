version: gepa-base
parent_version: null
backend: minimax_h3
text_llm: openai
decision: http
prompts:
  script: 'You are a screenwriter. Given a one-line idea, expand it into a short film
    script

    (<= 120 words) with a clear setup, a visible conflict and a resolution.

    Keep a single protagonist and a single location unless the idea requires more.

    '
  storyboard: 'You are a storyboard artist specializing in AI video generation pipelines.
    Your task is to convert a provided script into a JSON list of shots optimized
    for downstream video generation.


    ## Input Format

    The input will contain a script with timestamped shots (e.g., **SHOT 1 (0:00-0:02)**)
    and descriptive action lines.


    ## Output Format

    Return ONLY a valid JSON list of objects. Do not include markdown code blocks
    (```json) or conversational text.

    Each object must contain exactly these keys:

    - `index`: Integer (sequential, starting from 1).

    - `seconds`: Integer (duration in seconds).

    - `shot_size`: String (must be "wide", "medium", or "close").

    - `camera`: String (must be "static", "push", or "pan").

    - `action`: String (detailed visual description).


    ## Critical Requirements

    1. **Duration Matching**: Calculate the total duration from the script timestamps.
    The sum of all `seconds` values in your JSON list must exactly match this total
    duration.

    2. **Visual Consistency**: Maintain strict visual consistency for all recurring
    subjects (characters, clothing, props, lighting). You must explicitly repeat defining
    features (e.g., "lime-green jacket," "flour-dusted face") in the `action` description
    for every shot where the subject appears. This is critical for subject persistence
    scores.

    3. **Physical Plausibility**: Ensure all actions described in the `action` field
    adhere to real-world physics (gravity, object interaction, natural motion). Incorrect
    physics will result in low video scores.

    4. **Visual Detail**: The `action` description must be rich in visual descriptors
    (colors, textures, lighting direction, spatial context) to support high-fidelity
    video generation.

    5. **Schema Adherence**: Strictly use the allowed values for `shot_size` and `camera`
    defined above.


    ## Evaluation Criteria

    Your output will be scored on:

    - **Video Quality**: Visual coherence, subject consistency, and physical logic.

    - **Story**: Completeness and faithfulness to the script.

    - **Editing**: Duration accuracy and pacing (total seconds vs. script duration).

    - **Judges**: Alignment, Coherence, and Style scores will be assessed based on
    your descriptions.'
  director: 'You are a film director writing a prompt for MiniMax-H3. Produce exactly
    three parts:

    `integrated_multimodal_description` (with [Shot N] blocks and timestamps),

    `overall_soundscape`, and `non_diegetic_music`. Be concrete about lighting, materials,

    and motion. Repeat the protagonist''s appearance in every shot.

    '
  critic: 'You are a film critic. Given a script, storyboard and video, list concrete
    defects under

    these axes: physics, subject consistency, story clarity, pacing, audio. Be specific
    and

    short. Do not praise.

    '
  editor: 'You are an editor. Given candidate videos and their scores, pick the best
    one and explain

    in two sentences which shots to keep and which to shorten.

    '
memory: []
workflow:
- script
- storyboard
- director
- critic
- editor
tool_routing:
  enabled_tools:
  - video_generate
  - frame_judge
  - av_check
  strategy: fixed
  task_type_router:
    enabled: false
    default: t2va
planning:
  strategy: hierarchical
  max_shots: 3
  min_shot_seconds: 1.5
  num_candidates: 1
critic:
  gate_thresholds:
    physics_ok: 0.6
    subject_consistent: 0.6
  rubric: []
  video_subweights:
    unified_reward: 1.0
    av_alignment: 0.0
reward_weights:
  video: 0.6
  story: 0.25
  editing: 0.15
  human: 0.0
target_defaults:
  short_edge: 768
  aspect_ratio: '16:9'
  duration_seconds: 5.0
  frame_rate: 24.0
  num_inference_steps: 10
  seed: 0
notes: Frozen GEPA smoke baseline; prompts and memory are the only search components.
