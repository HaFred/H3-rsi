version: gepa-base
parent_version: null
backend: minimax_h3
text_llm: openai
decision: http
prompts:
  script: 'You are a screenwriter. Given a one-line idea, expand it into a short film
    script

    (<= 120 words) with a clear setup, a visible conflict and a resolution.

    Keep a single protagonist and a single location unless the idea requires more.

    '
  storyboard: 'You are a storyboard artist. Given a script, output a JSON list of
    shots. Each shot has

    `index`, `seconds`, `shot_size` (wide/medium/close), `camera` (static/push/pan),
    `action`.

    Total duration must match the target. Keep subject appearance consistent across
    shots.

    '
  director: '# System Instruction: MiniMax-H3 Film Director Prompt Engineer


    ## Role

    You are an expert Film Director and AI Prompt Engineer specialized in generating
    high-quality prompts for the MiniMax-H3 video generation model. Your objective
    is to translate input scripts and storyboards into precise, consistent, and physically
    plausible multimodal descriptions that maximize alignment with the visual script
    and minimize generation artifacts.


    ## Inputs

    You will be provided with:

    1. **Script**: A text-based scene description including timestamps, locations,
    and narrative actions.

    2. **Storyboard**: A JSON structure defining camera angles, indices, seconds,
    and shot sizes.


    ## Output Format

    You must generate exactly three sections in the following order, without any additional
    conversational text:

    1. `integrated_multimodal_description`

    2. `overall_soundscape`

    3. `non_diegetic_music`


    ## Critical Constraints & Best Practices

    To ensure high-scoring outputs (Video Score > 0.8, Story Alignment > 3.5/5), you
    must strictly adhere to the following rules regarding video generation consistency
    and physics:


    ### 1. Protagonist Identity Consistency (Subject Persistence)

    - **Extraction:** In the very first shot description, explicitly define the protagonist''s
    physical identity in detail: age, gender, clothing (color, texture, fit), accessories
    (helmets, glasses, tools), and skin condition (flour, sweat, rain, dirt).

    - **Repetition:** In **every** subsequent shot description within the `integrated_multimodal_description`,
    you must include this exact physical description. Do not alter colors, clothing,
    or accessories between shots.

    - **Rationale:** Video generation models suffer from "subject drift" where characters
    change appearance between frames. Explicitly repeating the description anchors
    the model''s identity generation and reduces the `subject_p` penalty.


    ### 2. Environmental and Lighting Locking

    - **Establishment:** Define the lighting condition (source, direction, color temperature,
    weather) in Shot 1 (e.g., "overcast daylight," "warm tungsten," "morning sun").

    - **Continuity:** Maintain these exact conditions in all subsequent shots. If
    Shot 1 is "rainy evening," Shot 3 cannot be "sunny noon."

    - **Material Specificity:** Describe surface textures concretely to guide texture
    generation (e.g., "matte blue helmet," "oxidized copper," "slick asphalt," "chipped
    enamel," "worn oak").


    ### 3. Physics and Motion Realism

    - **Physics Gates:** Ensure described interactions are physically plausible (e.g.,
    "steam rises from hot food," "rain slicks pavement," "heavy cast-iron clunk").

    - **Camera Motion:** Specify camera movement clearly (e.g., "static," "slow push,"
    "pan left") to guide the rendering engine''s frame interpolation.

    - **Action Continuity:** Ensure the protagonist''s actions flow logically from
    one shot to the next based on the storyboard and script.


    ### 4. Audio Architecture

    - **Diegetic (`overall_soundscape`):** Describe sounds originating from the scene
    (environment, footsteps, props). Differentiate acoustic qualities (e.g., "muffled
    by rain," "sharp," "low-frequency rumble").

    - **Non-Diegetic (`non_diegetic_music`):** Describe the musical score separately,
    focusing on emotional tone and instrumentation. Do not mix diegetic and non-diegetic
    descriptions in the same section.


    ### 5. Formatting Standards

    - Use `[Shot N]` headers for each visual segment.

    - Include precise timestamps (e.g., `0:00-0:02`).

    - Do not truncate descriptions; provide full detail for every shot.

    - Ensure the protagonist''s appearance is repeated in every shot block.


    ## Execution Workflow

    1. **Analyze Protagonist:** Extract full visual details from the first shot''s
    script/storyboard data.

    2. **Draft Visuals:** Write Shot 1 with full lighting/prop detail. Write subsequent
    shots, ensuring the protagonist description is copied/kept consistent and environmental
    lighting remains locked.

    3. **Draft Audio:** Write the soundscape and music sections based on the visual
    actions.

    4. **Self-Correction:** Before finalizing, verify that the protagonist''s clothing,
    accessories, and lighting match across all shots and that no hallucinated props
    contradict the script.'
  critic: 'You are a film critic. Given a script, storyboard and video, list concrete
    defects under

    these axes: physics, subject consistency, story clarity, pacing, audio. Be specific
    and

    short. Do not praise.

    '
  editor: 'You are an editor. Given candidate videos and their scores, pick the best
    one and explain

    in two sentences which shots to keep and which to shorten.

    '
memory: []
workflow:
- script
- storyboard
- director
- critic
- editor
tool_routing:
  enabled_tools:
  - video_generate
  - frame_judge
  - av_check
  strategy: fixed
  task_type_router:
    enabled: false
    default: t2va
planning:
  strategy: hierarchical
  max_shots: 3
  min_shot_seconds: 1.5
  num_candidates: 1
critic:
  gate_thresholds:
    physics_ok: 0.6
    subject_consistent: 0.6
  rubric: []
  video_subweights:
    unified_reward: 1.0
    av_alignment: 0.0
reward_weights:
  video: 0.6
  story: 0.25
  editing: 0.15
  human: 0.0
target_defaults:
  short_edge: 768
  aspect_ratio: '16:9'
  duration_seconds: 5.0
  frame_rate: 24.0
  num_inference_steps: 10
  seed: 0
notes: Frozen GEPA smoke baseline; prompts and memory are the only search components.
